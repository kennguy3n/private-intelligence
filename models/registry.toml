# zk-ai model registry.
#
# Defines all models and LoRA adapters available in the zk-ai ecosystem.
# The model manager reads this to know which models to download, their
# sizes, tier requirements, and which tasks they support.

[[models]]
name = "mt5-small"
version = "1.0.0"
base = true
formats = ["onnx"]
quantizations = ["int8", "int4", "fp16"]
sizes = { int8 = "45MB", int4 = "25MB", fp16 = "120MB" }
languages = ["en", "vi", "th", "ar", "zh", "es"]
min_tier = "low"
tasks = ["summarize", "translate", "key_points", "generate_doc", "generate_slides"]

[[models]]
name = "multilingual-e5-small"
version = "1.0.0"
base = true
formats = ["onnx"]
quantizations = ["int8"]
sizes = { int8 = "45MB" }
languages = ["en", "vi", "th", "ar", "zh", "es"]
min_tier = "low"
tasks = ["embed", "search"]

[[models]]
name = "clip-vit-base-patch32"
version = "1.0.0"
base = true
formats = ["onnx"]
quantizations = ["int8", "fp16"]
sizes = { int8 = "60MB", fp16 = "150MB" }
min_tier = "mid"
tasks = ["image_search"]

# ─── LoRA Adapters ──────────────────────────────────────────────────
# Each adapter is a small (3-5MB) file that specializes the mT5-small
# base model for a specific task + language. Adapters are hot-swapped
# at runtime (<10ms).

# Summarization adapters (6 languages)
[[adapters]]
