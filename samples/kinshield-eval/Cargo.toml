[package]
name = "kinshield-eval"
version = "0.1.0"
edition = "2021"

[dependencies]
kinshield = { path = "../../crates/kinshield" }
zk-ai-core = { path = "../../crates/core" }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
csv = "1.3"
chrono = "0.4"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[[bin]]
name = "kinshield-eval"
path = "src/main.rs"

[[bin]]
name = "debug-embed"
path = "src/bin/debug_embed.rs"
