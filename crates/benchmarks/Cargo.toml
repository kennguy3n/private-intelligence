[package]
name = "zk-ai-benchmarks"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Performance benchmarks for zk-ai SDK"

[dependencies]
zk-ai-core = { path = "../core" }
tokio = { workspace = true }
async-trait = { workspace = true }
criterion = { version = "0.5", features = ["async_tokio", "html_reports"] }
tempfile = { workspace = true }
serde_json = { workspace = true }

[[bench]]
name = "bench_pipeline_latency"
harness = false

[[bench]]
name = "bench_search_throughput"
harness = false

[[bench]]
name = "bench_streaming"
harness = false

[[bench]]
name = "bench_swarm"
harness = false

[[bench]]
name = "bench_cold_start"
harness = false

[[bench]]
name = "bench_governor"
harness = false

[[bench]]
name = "bench_comprehensive"
harness = false
