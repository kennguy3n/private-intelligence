[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/benchmarks",
    "crates/wasm",
    "crates/uniffi",
    "crates/napi",
    "crates/go-ffi",
    "samples/kinshield",
    "samples/kchat-b2c",
    "samples/kchat-b2b",
    "samples/kinsense",
]

# zk-ai — cross-platform on-device AI inference SDK.
#
# One Rust codebase compiled to:
#   * WASM  — browser (WebGPU + Web Worker)
#   * N-API — Electron desktop (Metal, DirectML, Vulkan)
#   * UniFFI — iOS (CoreML/Metal/ANE) and Android (NNAPI/NPU)
#   * cgo   — Go server-side offload service
#
# The core crate (zk-ai-core) contains the inference engine, device
# profiler, model manager, resource governor, and task pipelines. All
# platform bindings are thin wrappers that expose the same API surface
# through their respective FFI mechanisms.

[workspace.package]
edition = "2021"
rust-version = "1.86"
license = "Apache-2.0"
repository = "https://github.com/kennguy3n/zk-ai"
authors = ["ZK AI Engineering <eng@uney.com>"]
description = "Privacy-first cross-platform on-device AI inference SDK"

[workspace.dependencies]
# Async / runtime
tokio = { version = "1", features = ["full"] }
futures = "0.3"
async-trait = "0.1"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

# Errors / logging
thiserror = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# ML inference
ort = { version = "2.0.0-rc.12", default-features = false, features = ["tls-rustls"] }
ndarray = "0.17"
tokenizers = { version = "0.21", default-features = false }

# Crypto / hashing
sha2 = "0.10"
hex = "0.4"

# UUIDs / time
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }

# HTTP (for model downloads on native platforms)
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }

# Regex (lightweight, for PII pattern matching)
regex-lite = "0.1"

# System APIs (for resource governor on native platforms)
libc = "0.2"

# Testing
tempfile = "3"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"

[profile.wasm-release]
inherits = "release"
opt-level = "s"
lto = true
